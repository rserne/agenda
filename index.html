<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Agenda</title>
<meta name="description" content="Je week in één oogopslag: wat opvalt, alles, en waar je nog tijd hebt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png">
<!-- iOS rondt de hoeken zelf af: dit icoon is tot de rand gevuld, zonder extra marge -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="shell">
<!-- Zijbalk: alleen op de desktop (maandkalender, Agenda, Notities en Instellingen) -->
<aside class="zijbalk" id="zijbalk" aria-label="Navigatie"></aside>
<div class="hoofd">
<header class="kop" id="kop">
  <div class="kolom">
    <div class="kopblok">
      <div class="kopregel">
        <!-- iPad: zijbalk in- en uitklappen -->
        <button class="zijbalkknop" id="zijbalkknop" aria-label="Zijbalk tonen of verbergen" aria-controls="zijbalk"><svg class="icoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button>
        <button class="titelknop" id="titelknop" aria-label="Kies een week" aria-haspopup="dialog">
          <span class="titel" id="titel">Week</span>
          <svg class="icoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <!-- Week of Vooruitblik: het icoon van de huidige weergave, een tik opent het menu. Naar vandaag: tik nog eens op de tab Agenda -->
        <button class="weergaveknop glas" id="weergaveknop" aria-label="Weergave" aria-haspopup="menu" aria-expanded="false"></button>
        <div class="capsule glas" id="capsule"></div>
        <button class="nieuwknop glas" id="nieuwknop" data-nieuw aria-label="Nieuw" aria-haspopup="menu" aria-expanded="false"><svg class="icoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Nieuw</span></button>
      </div>
      <button class="datumregel" id="datumregel"></button>
    </div>
    <div class="balkregel">
    <div class="schakelaar glas" id="schakelaar" role="tablist" aria-label="Weergave">
      <button data-filter="notable" role="tab">Opvallend</button>
      <button data-filter="all" role="tab">Alles</button>
      <button data-filter="free" role="tab">Vrij</button>
    </div>
    <!-- Tab Notities: zoeken op de plek van de schakelaar -->
    <label class="zoekbalk glas" id="zoekbalk"><svg class="icoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg><input type="search" id="notzoek" placeholder="Zoeken" aria-label="Zoeken in notities" autocomplete="off" enterkeyhint="search"></label>
    </div>
  </div>
</header>

<main id="inhoud" class="kolom"></main>
</div>
</div>

<nav class="tabbalk" id="tabbalk" aria-label="Tabbladen">
  <div class="kolom">
    <!-- Instellingen: een rond knopje links, het spiegelbeeld van de plusknop rechts -->
    <button class="tabtandwiel glas" data-tab="instellingen" aria-label="Instellingen"></button>
    <div class="pil glas" role="tablist">
      <button data-tab="agenda" role="tab">Agenda</button>
      <button data-tab="notities" role="tab">Notities</button>
    </div>
    <!-- Nieuw: op telefoon en tablet naast de tabbalk, binnen bereik van de duim. Opent een keuze: nieuwe afspraak of tijden uit een mail -->
    <button class="plusknop glas" data-nieuw aria-label="Nieuw" aria-haspopup="menu" aria-expanded="false"><svg class="icoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</nav>

<div id="lagen"></div>
<!-- Melding als er een nieuwe versie van de app klaarstaat -->
<div class="updatemelding glas" id="updatemelding" role="status" hidden>
  <span>Nieuwe versie beschikbaar</span>
  <button class="vernieuw" id="vernieuwknop">Vernieuwen</button>
  <button class="later" id="laterknop" aria-label="Later">×</button>
</div>
<!-- Telefoon: verschijnt als je onderaan de week verder omhoog trekt -->
<div id="doortrek" aria-hidden="true">
  <span class="dtpijl"><svg class="icoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span>
  <span class="dttekst"></span>
</div>
<!-- Voortgang en fouten bij het ophalen van je agenda via een link -->
<div class="updatemelding glas statusmelding" id="statusmelding" role="status" aria-live="polite" hidden>
  <span class="draaier" aria-hidden="true"></span>
  <span id="statustekst"></span>
  <button class="vernieuw" id="statusactie" hidden></button>
  <button class="later" id="statussluit" aria-label="Sluiten">×</button>
</div>
<!-- Eigen agenda-bestand: wordt alleen op dit toestel bewaard, nooit verstuurd -->
<input type="file" id="icsinvoer" accept=".ics,text/calendar" hidden>
<input type="file" id="contactinvoer" accept=".csv,.txt,.vcf,text/csv,text/plain,text/vcard,text/x-vcard" hidden>

<script src="voorbeeld.js"></script>
<script src="app.js"></script>
<script src="js/gegevens.js"></script>
<script src="js/contacten.js"></script>
<script src="js/locaties.js"></script>
<script src="js/mailtijden.js"></script>
<script src="js/indeling.js"></script>
<script src="js/weergave.js"></script>
<script src="js/panelen.js"></script>
<script src="js/notities.js"></script>
<script src="js/synchroniseren.js"></script>
<script src="js/bediening.js"></script>
</body>
</html>
