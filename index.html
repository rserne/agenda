<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Agenda</title>
<meta name="description" content="Je week in één oogopslag: wat opvalt, alles, en waar je nog tijd hebt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png">
<!-- iOS legt een afgeronde vierkant over het icoon heen; het maskable-icoon heeft daar marge voor -->
<link rel="apple-touch-icon" href="icon-maskable-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="shell">
<!-- Zijbalk: alleen op de desktop (maandkalender, weergave en filter) -->
<aside class="zijbalk" id="zijbalk" aria-label="Navigatie"></aside>
<div class="hoofd">
<header class="kop" id="kop">
  <div class="kolom">
    <div class="kopblok">
      <div class="kopregel">
        <button class="titelknop" id="titelknop" aria-label="Kies een week" aria-haspopup="dialog">
          <span class="titel" id="titel">Week</span>
          <svg class="icoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="capsule glas" id="capsule"></div>
        <button class="nieuwknop glas" id="nieuwknop" data-nieuw aria-label="Nieuwe afspraak"><svg class="icoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Nieuw</span></button>
      </div>
      <button class="datumregel" id="datumregel" aria-label="Naar vandaag"></button>
    </div>
    <div class="schakelaar glas" id="schakelaar" role="tablist" aria-label="Weergave">
      <button data-filter="notable" role="tab">Opvallend</button>
      <button data-filter="all" role="tab">Alles</button>
      <button data-filter="free" role="tab">Vrij</button>
    </div>
  </div>
</header>

<main id="inhoud" class="kolom"></main>
</div>
</div>

<nav class="tabbalk" id="tabbalk" aria-label="Tabbladen">
  <div class="kolom">
    <div class="pil glas" role="tablist">
      <button data-tab="week" role="tab">Week</button>
      <button data-tab="forecast" role="tab">Vooruitblik</button>
    </div>
    <!-- Nieuwe afspraak: op telefoon en tablet naast de tabbalk, binnen bereik van de duim -->
    <button class="plusknop glas" data-nieuw aria-label="Nieuwe afspraak"><svg class="icoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</nav>

<div id="lagen"></div>
<!-- Eigen agenda-bestand: wordt alleen op dit toestel bewaard, nooit verstuurd -->
<input type="file" id="icsinvoer" accept=".ics,text/calendar" hidden>

<script src="voorbeeld.js"></script>
<script src="app.js"></script>
</body>
</html>
