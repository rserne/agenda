<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Outlook-test</title>
<!-- Proefpagina: welke adressen openen de Outlook-app op iOS? Hoort niet bij de app zelf. -->
<style>
  :root { --bg:#F2F2F7; --kaart:#FFFFFF; --tekst:#000; --sub:#6E6E73; --lijn:rgba(60,60,67,.18); --blauw:#007AFF; --groen:#1E7B34; --rood:#C0392B; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --kaart:#1C1C1E; --tekst:#fff; --sub:#98989F; --lijn:rgba(84,84,88,.6); --blauw:#0A84FF; --groen:#30D158; --rood:#FF6961; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tekst); font:17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px); }
  main { max-width:600px; margin:0 auto; }
  h1 { font-size:28px; margin:8px 0 4px; }
  p.uitleg { color:var(--sub); font-size:15px; margin:0 0 20px; }
  h2 { font-size:13px; font-weight:400; text-transform:uppercase; letter-spacing:.02em; color:var(--sub); margin:24px 16px 6px; }
  .groep { background:var(--kaart); border-radius:12px; overflow:hidden; }
  .proef { display:flex; align-items:center; gap:12px; padding:12px 16px; border-top:.5px solid var(--lijn); }
  .proef:first-child { border-top:0; }
  .proef .tekst { flex:1; min-width:0; }
  .proef .naam { font-weight:600; }
  .proef code { display:block; font:12px/1.35 ui-monospace, Menlo, monospace; color:var(--sub); word-break:break-all; margin-top:2px; }
  .proef .uitkomst { font-size:13px; margin-top:4px; }
  .proef .uitkomst.ok { color:var(--groen); }
  .proef .uitkomst.mis { color:var(--rood); }
  button { font:inherit; font-size:15px; font-weight:600; color:#fff; background:var(--blauw); border:0; border-radius:999px; padding:8px 16px; flex:none; }
  button.stil { background:transparent; color:var(--blauw); padding:8px 4px; font-weight:400; }
  #log { background:var(--kaart); border-radius:12px; padding:12px 16px; font:13px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; min-height:48px; }
  .knoppen { display:flex; gap:12px; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>Outlook-test</h1>
  <p class="uitleg">Tik op een knop. Opent de Outlook-app, kom dan terug naar deze pagina: hieronder staat wat er gebeurde. Werkt een knop niet, dan zie je dat na twee seconden. Stuur me daarna het logboek (knop onderaan).</p>

  <div id="proeven"></div>

  <h2>Logboek</h2>
  <div id="log">Nog niets geprobeerd.</div>
  <div class="knoppen">
    <button class="stil" id="kopieer">Logboek kopiëren</button>
    <button class="stil" id="wis">Wissen</button>
  </div>
</main>

<script>
'use strict';
const pad = (n) => String(n).padStart(2, '0');
const morgen = new Date(); morgen.setDate(morgen.getDate() + 1);
const dag = `${morgen.getFullYear()}-${pad(morgen.getMonth() + 1)}-${pad(morgen.getDate())}`;
const start = `${dag}T10:00:00`, eind = `${dag}T11:00:00`;
const titel = encodeURIComponent('Proef vanuit Agenda');
const plaats = encodeURIComponent('Kamer 1');

const GROEPEN = [
  ['De agenda openen', [
    ['App openen', 'ms-outlook://'],
    ['Agenda in de app (events)', 'ms-outlook://events'],
    ['Agenda in de app (calendar)', 'ms-outlook://calendar'],
    ['Agenda op een dag', `ms-outlook://events?date=${dag}`],
  ]],
  ['Nieuwe afspraak (morgen 10:00–11:00)', [
    ['events/new', `ms-outlook://events/new?title=${titel}&start=${start}&end=${eind}&location=${plaats}`],
    ['calendar/compose', `ms-outlook://calendar/compose?subject=${titel}&startdt=${start}&enddt=${eind}&location=${plaats}&allday=false`],
  ]],
  ['Webadres (opent dit de app?)', [
    ['outlook.office.com/calendar', 'https://outlook.office.com/calendar/'],
  ]],
  ['Met terugval naar de browser', [
    ['App, anders browser', 'ms-outlook://events', 'https://outlook.office.com/calendar/'],
  ]],
];

const regels = [];
function log(t) {
  const n = new Date();
  regels.push(`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}  ${t}`);
  document.getElementById('log').textContent = regels.join('\n');
}
log(`${navigator.userAgent.match(/(iPhone|iPad|Macintosh)[^;)]*/)?.[0] || 'onbekend toestel'}; ${navigator.standalone ? 'vanaf beginscherm' : 'in de browser'}`);

let lopend = null; // { naam, el, t0, weg, terugval }

document.addEventListener('visibilitychange', () => {
  if (!lopend) return;
  const ms = Date.now() - lopend.t0;
  if (document.hidden) {
    lopend.weg = true;
    log(`${lopend.naam}: pagina verdween na ${ms} ms`);
  } else {
    log(`${lopend.naam}: terug op de pagina na ${(ms / 1000).toFixed(1)} s`);
    uitkomst(lopend.el, 'ok', 'Er opende iets (app of venster). Wat zag je?');
    lopend = null;
  }
});
window.addEventListener('pagehide', () => { if (lopend) log(`${lopend.naam}: pagehide`); });
window.addEventListener('blur', () => { if (lopend && !lopend.weg) log(`${lopend.naam}: venster verloor de focus (mogelijk een vraag "Openen in Outlook?")`); });

function uitkomst(el, soort, tekst) {
  const u = el.querySelector('.uitkomst');
  u.className = `uitkomst ${soort}`;
  u.textContent = tekst;
}

function probeer(naam, url, terugval, el) {
  lopend = { naam, el, t0: Date.now(), weg: false };
  uitkomst(el, '', 'Bezig…');
  log(`${naam}: ${url}`);
  setTimeout(() => {
    if (!lopend || lopend.naam !== naam || lopend.weg) return;
    if (terugval) {
      log(`${naam}: geen app na 1,5 s, dus naar de browser`);
      uitkomst(el, 'mis', 'Geen app; terugval naar de browser.');
      lopend = null;
      location.href = terugval;
    }
  }, 1500);
  setTimeout(() => {
    if (!lopend || lopend.naam !== naam || lopend.weg) return;
    log(`${naam}: na 2 s nog steeds hier (niets geopend, of een vraag die nog openstaat)`);
    uitkomst(el, 'mis', 'Niets geopend (of stond er een vraag?).');
  }, 2000);
  location.href = url;
}

const doos = document.getElementById('proeven');
for (const [kop, proeven] of GROEPEN) {
  const h = document.createElement('h2'); h.textContent = kop; doos.append(h);
  const g = document.createElement('div'); g.className = 'groep'; doos.append(g);
  for (const [naam, url, terugval] of proeven) {
    const r = document.createElement('div'); r.className = 'proef';
    r.innerHTML = `<div class="tekst"><div class="naam"></div><code></code><div class="uitkomst"></div></div><button>Probeer</button>`;
    r.querySelector('.naam').textContent = naam;
    r.querySelector('code').textContent = url;
    r.querySelector('button').addEventListener('click', () => probeer(naam, url, terugval, r));
    g.append(r);
  }
}

document.getElementById('wis').addEventListener('click', () => { regels.length = 0; log('Gewist.'); });
document.getElementById('kopieer').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(regels.join('\n')); log('Gekopieerd.'); }
  catch (e) { log('Kopiëren lukte niet; maak een schermafbeelding.'); }
});
</script>
</body>
</html>
